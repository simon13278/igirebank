<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Igirebank</title>
        <link rel="stylesheet" href="login2.css">
        <link rel="stylesheet" href="css/boxiconns.min.css">
    </head>
    <body>
        <div class="container">
            <div class="form-box login ">
                <form action="">
                    <h1>
                        Login
                    </h1>
                    <di class="input-box">
                        <input type="text" placeholder="Username" required>
                        <i class='bx bxs-user'></i>
                    </di>
                    <div class="input-box">
                        <input type="password" placeholder="Password" required>
                        <i class='bx bxs-lock-alt'></i>
                    </div>
                    <div class="forgot-link">
                        <a href="a">Forgot password</a>
                    </div>
                    <button type="submit" class="btn">Login</button>
                    <p>Or login with social platforms</p>
                    <div class="social-icons">
                        <a href="a" class="Google"><i class='bx blx-google'></i></a>
                        <a href="a" class="facebook"><i class='bx blx-facebook'></i></a>
                        <a href="a" class="github"><i class='bx blx-github'></i></a>
                        <a href="a" class="linkedin"><i class='bx blx-linkedin'></i></a>
                    </div>
                </form>
            </div>
            <div class="form-box register">
                <form action="">
                    <h1>Registration</h1>
                    <div class="input-box ">
                        <input type="text" placeholder="Username" required>
                        <i class='bx bxs-user'></i>
                    </div>
                    <div class="input-box ">
                        <input type="email" placeholder="Email" required>
                        <i class='bx bxs-envelop'></i>
                    </div>
                    <div class="input-box ">
                        <input type="password" placeholder="Password" required>
                        <i class='bx bxs-lock-alt'></i>
                    </div>
                    <p>Or register with social platforms</p>
                    <div class="social-icons">
                        <a href="a" class="Google"><i class='bx blx-google'></i></a>
                        <a href="a" class="facebook"><i class='bx blx-facebook'></i></a>
                        <a href="a" class="github"><i class='bx blx-github'></i></a>
                        <a href="a" class="linkedin"><i class='bx blx-linkedin'></i></a>
                    </div>
                </form> 
            </div>
            <div class="toggle-box">
                <div class="toggle-panel toggle-left">
                    <h1>Hello,Welcome to IgireBank</h1>
                    <p>Don't have an account?</p>
                    <button class="btn register-btn">Register</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Welcome Back to IgireBank</h1>
                    <p>Already have an account?</p>
                    <button class="btn login-btn">login</button>
                </div>
            </div>
        </div>
        <script src="java.js" defer></script>
    </body>
</html>
